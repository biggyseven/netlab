<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">NETLAB LAB 001, topologie logique d'une infrastructure PME segmentée</title>
  <desc id="desc">Le WAN rejoint pfSense, qui porte les passerelles et le filtrage, puis un trunk 802.1Q rejoint un switch de couche 2 distribuant les VLAN Administration 10, Utilisateurs 20 et Serveurs 30.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1420"/><stop offset="1" stop-color="#142638"/></linearGradient>
    <linearGradient id="firewall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#163b45"/><stop offset="1" stop-color="#102b37"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity=".28"/></filter>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#85a4b8}
      .heading{font-size:31px;font-weight:700;fill:#f2f7fb}
      .sub{font-size:17px;fill:#a9bdcb}
      .node{fill:#152638;stroke:#365064;stroke-width:2}
      .node-title{font-size:21px;font-weight:700;fill:#f3f7fb}
      .node-sub{font-size:14px;fill:#a7bdcb}
      .port{font-size:12px;font-weight:700;letter-spacing:1px;fill:#8ca8ba}
      .link{fill:none;stroke:#63c8d2;stroke-width:4;stroke-linecap:round}
      .branch{fill:none;stroke:#56758b;stroke-width:3;stroke-linecap:round}
      .vlan{font-size:19px;font-weight:700;fill:#f0f6fb}
      .net{font-size:15px;fill:#b5c8d4}
      .small{font-size:13px;fill:#8fa8b9}
      .tag{font-size:12px;font-weight:700;letter-spacing:1.5px;fill:#b7dce0}
    </style>
  </defs>
  <rect width="1440" height="920" rx="26" fill="url(#bg)"/>
  <path d="M0 150H1440M0 840H1440" stroke="#294155" stroke-width="1"/>
  <text x="82" y="76" class="eyebrow">NETLAB / LAB 001</text>
  <text x="82" y="122" class="heading">Infrastructure PME segmentée</text>
  <text x="1358" y="78" text-anchor="end" class="eyebrow">ARCHITECTURE LOGIQUE</text>
  <rect x="1055" y="101" width="303" height="34" rx="17" fill="#4a351c" stroke="#9b7133"/>
  <text x="1206" y="123" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="1.2" fill="#f3d7a5">PROPOSITION · NON DÉPLOYÉE</text>

  <g filter="url(#shadow)">
    <rect x="105" y="226" width="245" height="122" rx="18" class="node"/>
    <circle cx="159" cy="287" r="27" fill="#203c51" stroke="#52758e" stroke-width="2"/>
    <path d="M146 289h26m-13-13v26m-9-18 9-8 9 8m-18 14 9 8 9-8" stroke="#c1d6e2" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="202" y="274" class="node-title">WAN / NAT</text>
    <text x="202" y="300" class="node-sub">Accès externe GNS3</text>
    <text x="202" y="322" class="small">Réseau amont du labo</text>
  </g>

  <path d="M350 287H515" class="link"/>
  <circle cx="350" cy="287" r="5" fill="#63c8d2"/>
  <circle cx="515" cy="287" r="5" fill="#63c8d2"/>
  <text x="433" y="268" text-anchor="middle" class="port">WAN</text>

  <g filter="url(#shadow)">
    <rect x="515" y="207" width="340" height="160" rx="20" fill="url(#firewall)" stroke="#4c9e9f" stroke-width="2.5"/>
    <path d="M555 253 586 241l31 12v25c0 25-31 43-31 43s-31-18-31-43z" fill="#1b5660" stroke="#71cbd0" stroke-width="2"/>
    <path d="m572 275 10 10 19-22" stroke="#b9f2e9" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="642" y="258" class="node-title">pfSense</text>
    <text x="642" y="287" class="node-sub">Passerelles VLAN · routage</text>
    <text x="642" y="311" class="node-sub">Filtrage inter-zones · NAT</text>
    <rect x="642" y="328" width="178" height="23" rx="11" fill="#1c5159"/>
    <text x="731" y="344" text-anchor="middle" class="tag">PARE-FEU CENTRAL</text>
  </g>

  <path d="M685 367V466" class="link"/>
  <circle cx="685" cy="367" r="5" fill="#63c8d2"/>
  <circle cx="685" cy="466" r="5" fill="#63c8d2"/>
  <rect x="712" y="397" width="205" height="48" rx="10" fill="#173b49" stroke="#3c7780"/>
  <text x="814" y="417" text-anchor="middle" class="tag">TRUNK 802.1Q</text>
  <text x="814" y="434" text-anchor="middle" font-size="12" fill="#a9c8d0">VLAN 10 · 20 · 30</text>

  <g filter="url(#shadow)">
    <rect x="515" y="466" width="340" height="112" rx="18" class="node"/>
    <rect x="553" y="498" width="57" height="45" rx="8" fill="#213d52" stroke="#52758e" stroke-width="2"/>
    <path d="M563 510h8m7 0h8m7 0h8m-31 11h8m7 0h8m7 0h8" stroke="#8fb0c3" stroke-width="3" stroke-linecap="round"/>
    <text x="636" y="510" class="node-title">Switch L2</text>
    <text x="636" y="537" class="node-sub">Commutation des VLAN</text>
    <text x="636" y="557" class="small">Pas de routage inter-VLAN</text>
  </g>

  <path d="M685 578V626M270 626H1100M270 626V674M685 626V674M1100 626V674" class="branch"/>
  <circle cx="270" cy="626" r="5" fill="#56758b"/><circle cx="685" cy="626" r="5" fill="#56758b"/><circle cx="1100" cy="626" r="5" fill="#56758b"/>
  <path d="M270 674v18M685 674v18M1100 674v18" class="branch"/>

  <g filter="url(#shadow)">
    <rect x="95" y="692" width="350" height="112" rx="16" fill="#1b2b3d" stroke="#54718b" stroke-width="2"/>
    <rect x="95" y="692" width="8" height="112" rx="4" fill="#56a6d5"/>
    <text x="128" y="729" class="vlan">VLAN 10 · ADMIN</text>
    <text x="128" y="758" class="net">192.168.10.0/24</text>
    <text x="128" y="782" class="small">Passerelle pfSense : 192.168.10.1</text>
    <text x="412" y="729" text-anchor="end" class="port">ACCESS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="510" y="692" width="350" height="112" rx="16" fill="#1b2b3d" stroke="#54718b" stroke-width="2"/>
    <rect x="510" y="692" width="8" height="112" rx="4" fill="#5abf9c"/>
    <text x="543" y="729" class="vlan">VLAN 20 · USERS</text>
    <text x="543" y="758" class="net">192.168.20.0/24</text>
    <text x="543" y="782" class="small">Passerelle pfSense : 192.168.20.1</text>
    <text x="827" y="729" text-anchor="end" class="port">ACCESS</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="925" y="692" width="350" height="112" rx="16" fill="#1b2b3d" stroke="#54718b" stroke-width="2"/>
    <rect x="925" y="692" width="8" height="112" rx="4" fill="#aa91e4"/>
    <text x="958" y="729" class="vlan">VLAN 30 · SERVERS</text>
    <text x="958" y="758" class="net">192.168.30.0/24</text>
    <text x="958" y="782" class="small">Passerelle pfSense : 192.168.30.1</text>
    <text x="1242" y="729" text-anchor="end" class="port">ACCESS</text>
  </g>

  <text x="82" y="868" class="small">Le switch commute le trafic au sein d'un même VLAN. Les communications entre VLAN remontent vers pfSense pour routage et filtrage.</text>
</svg>
