! NETLAB - LAB 001
! MODELE DE CONFIGURATION - A ADAPTER AU SWITCH REEL / APPLIANCE GNS3
! Hypotheses : Gi0/1 vers pfSense, Gi0/2 admin, Gi0/3 utilisateurs, Gi0/4 serveur.
! Ne pas coller sans verifier les noms d'interfaces et le support 802.1Q.

enable
configure terminal

hostname SW-LAB001

vlan 10
 name ADMIN
exit
vlan 20
 name USERS
exit
vlan 30
 name SERVERS
exit

! Trunk 802.1Q vers l'interface physique parent de pfSense
interface GigabitEthernet0/1
 description TRUNK_VERS_PFSENSE
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 no shutdown
exit

! Port d'acces du poste d'administration
interface GigabitEthernet0/2
 description POSTE_ADMIN
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
exit

! Port d'acces d'un poste utilisateur
interface GigabitEthernet0/3
 description POSTE_UTILISATEUR
 switchport mode access
 switchport access vlan 20
 spanning-tree portfast
 no shutdown
exit

! Port d'acces du serveur
interface GigabitEthernet0/4
 description SERVEUR_LAB
 switchport mode access
 switchport access vlan 30
 spanning-tree portfast
 no shutdown
exit

end
! Sauvegarder seulement apres verification :
! copy running-config startup-config

! Controles :
! show vlan brief
! show interfaces trunk
! show mac address-table dynamic
