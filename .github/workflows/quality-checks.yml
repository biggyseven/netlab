name: NETLAB quality checks

on:
  push:
    branches:
      - main
      - feature/netlab-v1-1
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Static site validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/network-tools.js

      - name: Validate pages, links and metadata
        run: python scripts/validate_site.py
